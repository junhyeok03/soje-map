services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: "${APP_BASE_PATH:-/junhyeok/pj}"
    image: soje-memory-map-frontend:local
    pull_policy: build
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_BASE_PATH: "${APP_BASE_PATH:-/junhyeok/pj}"
    ports:
      - "${FRONTEND_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-18080}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: soje-memory-map-backend:local
    pull_policy: build
    init: true
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-18081}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/actuator/health |
          grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
